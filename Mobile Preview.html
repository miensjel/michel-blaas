<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Michel — Mobile Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    font-family: "Geist Mono", ui-monospace, monospace;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }
  body.theme-dark { background: #1a1815; color: #ebe5db; }
  body.theme-light { background: #ebe5db; color: #1a1815; }
  body.theme-studio { background: #2a2723; color: #ebe5db; }

  body.theme-dark::before, body.theme-studio::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(214,90,31,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(240,179,65,0.05) 0%, transparent 50%);
  }

  .stage {
    min-height: 100vh;
    padding: 64px 32px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    position: relative;
  }

  .crumbs {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.55;
    display: flex; align-items: center; gap: 14px;
  }
  .crumbs a { color: inherit; text-decoration: none; opacity: 0.9; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .crumbs a:hover { color: #d65a1f; border-color: #d65a1f; }

  h1 {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-align: center;
    max-width: 16ch;
  }
  h1 em { color: #d65a1f; }

  .lede {
    text-align: center;
    max-width: 56ch;
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.65;
    letter-spacing: 0.02em;
  }

  .grid {
    display: grid;
    gap: 48px 56px;
    align-items: start;
    justify-content: center;
    margin-top: 24px;
  }
  .grid.cols-1 { grid-template-columns: auto; }
  .grid.cols-2 { grid-template-columns: repeat(2, auto); }
  .grid.cols-3 { grid-template-columns: repeat(3, auto); }
  @media (max-width: 980px) {
    .grid.cols-3 { grid-template-columns: repeat(2, auto); gap: 40px 32px; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr !important; gap: 56px; }
  }

  .device {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .device .label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.6;
    display: flex; align-items: center; gap: 10px;
  }
  .device .label .dash { width: 16px; height: 1px; background: currentColor; opacity: 0.5; display: inline-block; }

  /* ───── iPhone frame ───── */
  .phone {
    --w: 332px; --h: 712px;
    --bezel: #0a0a0a;
    --rail: #2a2723;
    width: var(--w);
    height: var(--h);
    background: var(--bezel);
    border-radius: 44px;
    padding: 8px;
    box-shadow:
      0 0 0 1.5px var(--rail),
      0 0 0 3px var(--bezel),
      0 30px 80px -20px rgba(0,0,0,0.65),
      0 10px 30px -10px rgba(0,0,0,0.5);
    position: relative;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .phone.tone-silver { --bezel: #d8d3cb; --rail: #b5afa5; }
  .phone.tone-titanium { --bezel: #6b6760; --rail: #4d4944; }
  .phone.tone-orange { --bezel: #d65a1f; --rail: #a8421a; }

  .phone::before {
    content: ""; position: absolute;
    right: -2px; top: 110px;
    width: 3px; height: 64px;
    background: var(--rail); border-radius: 2px;
  }
  .phone::after {
    content: ""; position: absolute;
    left: -2px; top: 100px;
    width: 3px; height: 32px;
    background: var(--rail); border-radius: 2px;
    box-shadow: 0 48px 0 var(--rail), 0 96px 0 var(--rail);
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: #ebe5db;
  }

  .island {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 102px; height: 30px;
    background: #000;
    border-radius: 999px;
    z-index: 20;
    pointer-events: none;
  }

  .status {
    position: absolute;
    top: 0; left: 0; right: 0; height: 48px; z-index: 15;
    padding: 14px 26px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-family: "SF Pro Text", -apple-system, system-ui, sans-serif;
    font-size: 14px; font-weight: 600;
    color: #1a1815; letter-spacing: -0.01em;
    pointer-events: none;
  }
  .status .icons { display: inline-flex; gap: 5px; align-items: center; }

  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; background: #ebe5db;
  }

  .phone.sm { --w: 300px; --h: 640px; }
  .phone.xs { --w: 270px; --h: 580px; }

  .caption {
    text-align: center;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    opacity: 0.6; line-height: 1.6;
  }
  .caption b { font-weight: 500; opacity: 1; }

  .notes {
    margin-top: 56px;
    max-width: 720px;
    border-top: 1px solid currentColor;
    padding-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    font-size: 11px; line-height: 1.6;
    opacity: 0.7;
  }
  @media (max-width: 640px) { .notes { grid-template-columns: 1fr; } }
  .notes h4 {
    font-family: "Instrument Serif", serif; font-style: italic;
    font-size: 22px; font-weight: 400;
    opacity: 1;
    margin-bottom: 8px;
    letter-spacing: -0.01em; text-transform: none;
  }

  .device.rot .phone {
    transform: rotate(90deg) scale(0.88);
    transform-origin: center;
  }
  .device.rot { margin: 80px 60px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "section1": "hero",
  "section2": "werk",
  "section3": "contact",
  "phoneCount": 3,
  "phoneTone": "black",
  "theme": "dark",
  "showStatus": true,
  "showIsland": true,
  "showNotes": true,
  "showCaptions": true,
  "rotated": false,
  "headline": "Drie schermen, één gevoel."
}/*EDITMODE-END*/;

const SECTIONS = {
  hero: { hash: "", label: "Hero", caption: "Header collapsed · 3D blijft draaibaar" },
  werk: { hash: "#werk", label: "Werk", caption: "Grid stapelt · drag-hint zichtbaar" },
  studio: { hash: "#studio", label: "Studio", caption: "Bio-card · klantenlijst gestapeld" },
  proces: { hash: "#proces", label: "Proces", caption: "Vijf stappen verticaal" },
  contact: { hash: "#contact", label: "Contact", caption: "Email serif italic · channels gestapeld" },
};

const DEVICE_SPECS = [
  { className: "",   name: "iPhone 15 Pro Max", size: "430 × 932" },
  { className: "sm", name: "iPhone 14",         size: "390 × 844" },
  { className: "xs", name: "iPhone SE",         size: "375 × 667" },
];

function StatusIcons() {
  return (
    <span className="icons">
      <svg width="18" height="10" viewBox="0 0 18 10" fill="currentColor"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="5" y="4" width="3" height="6" rx="0.5"/><rect x="10" y="2" width="3" height="8" rx="0.5"/><rect x="15" y="0" width="3" height="10" rx="0.5"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 11 L10 8.5 Q9 7.5 8 7.5 Q7 7.5 6 8.5 Z M4 6.5 Q8 3 12 6.5 L13.5 5 Q8 0 2.5 5 Z M0 3 Q8 -4 16 3 L14.5 4.5 Q8 -1 1.5 4.5 Z"/></svg>
      <svg width="26" height="11" viewBox="0 0 26 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="22" height="10" rx="2.5"/><rect x="2" y="2" width="19" height="7" fill="currentColor" rx="1"/><rect x="23.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" stroke="none"/></svg>
    </span>
  );
}

function Phone({ spec, sectionKey, tone, showStatus, showIsland, showCaption, rotated }) {
  const section = SECTIONS[sectionKey] || SECTIONS.hero;
  const phoneClasses = ["phone", spec.className, "tone-" + tone].filter(Boolean).join(" ");
  return (
    <div className={"device" + (rotated ? " rot" : "")}>
      <div className="label">
        <span>{spec.name}</span>
        <span className="dash"></span>
        <span>{spec.size}</span>
      </div>
      <div className={phoneClasses}>
        <div className="phone-screen">
          {showIsland && <div className="island"></div>}
          {showStatus && (
            <div className="status">
              <span>9:41</span>
              <StatusIcons />
            </div>
          )}
          <iframe src={"index.html" + section.hash} title={"Michel — " + section.label} loading="lazy" scrolling="yes"></iframe>
        </div>
      </div>
      {showCaption && (
        <div className="caption">
          <b>{section.label}</b><br/>
          {section.caption}
        </div>
      )}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply theme to body
  React.useEffect(() => {
    document.body.className = "theme-" + t.theme;
  }, [t.theme]);

  const sections = [t.section1, t.section2, t.section3].slice(0, t.phoneCount);
  const gridClass = "grid cols-" + t.phoneCount;

  return (
    <>
      <div className="stage">
        <div className="crumbs">
          <a href="index.html">← Terug naar site</a>
          <span>·</span>
          <span>Mobile preview</span>
        </div>

        <h1 dangerouslySetInnerHTML={{
          __html: t.headline.replace(/,\s*/, ",<br/>").replace(/(één gevoel|.{1,20})\.$/, "<em>$&</em>")
        }} />

        <p className="lede">
          Dezelfde site, geladen in verschillende telefoonformaten. Sleep aan de 3D-objecten — werkt ook op touch.
        </p>

        <div className={gridClass}>
          {sections.map((sectionKey, i) => (
            <Phone
              key={i}
              spec={DEVICE_SPECS[i] || DEVICE_SPECS[0]}
              sectionKey={sectionKey}
              tone={t.phoneTone}
              showStatus={t.showStatus}
              showIsland={t.showIsland}
              showCaption={t.showCaptions}
              rotated={t.rotated}
            />
          ))}
        </div>

        {t.showNotes && (
          <div className="notes">
            <div>
              <h4>Header</h4>
              <p>Nav verbergt onder 720px; alleen logo en beschikbaarheidsindicator blijven. Backdrop-blur voorkomt tekst-overlap bij scrollen.</p>
            </div>
            <div>
              <h4>3D op touch</h4>
              <p>OrbitControls werkt met één-vinger-sleep om te draaien. De drag-hint blijft permanent zichtbaar zodat de interactie ontdekbaar is.</p>
            </div>
            <div>
              <h4>Type­schaal</h4>
              <p>Alle koppen gebruiken <code>clamp()</code>, dus de hero schaalt vloeiend van 168px (desktop) naar 48px (telefoon).</p>
            </div>
          </div>
        )}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Layout" />
        <TweakRadio
          label="Aantal toestellen"
          value={String(t.phoneCount)}
          options={["1", "2", "3"]}
          onChange={(v) => setTweak('phoneCount', parseInt(v))}
        />
        <TweakToggle
          label="Liggend (90°)"
          value={t.rotated}
          onChange={(v) => setTweak('rotated', v)}
        />

        <TweakSection label="Wat tonen we" />
        <TweakSelect
          label="Toestel 1"
          value={t.section1}
          options={Object.keys(SECTIONS)}
          onChange={(v) => setTweak('section1', v)}
        />
        {t.phoneCount >= 2 && (
          <TweakSelect
            label="Toestel 2"
            value={t.section2}
            options={Object.keys(SECTIONS)}
            onChange={(v) => setTweak('section2', v)}
          />
        )}
        {t.phoneCount >= 3 && (
          <TweakSelect
            label="Toestel 3"
            value={t.section3}
            options={Object.keys(SECTIONS)}
            onChange={(v) => setTweak('section3', v)}
          />
        )}

        <TweakSection label="Toestel" />
        <TweakColor
          label="Behuizing"
          value={t.phoneTone}
          options={["black", "silver", "titanium", "orange"]}
          onChange={(v) => setTweak('phoneTone', v)}
        />
        <TweakToggle
          label="Dynamic Island"
          value={t.showIsland}
          onChange={(v) => setTweak('showIsland', v)}
        />
        <TweakToggle
          label="Statusbalk (9:41)"
          value={t.showStatus}
          onChange={(v) => setTweak('showStatus', v)}
        />

        <TweakSection label="Achtergrond" />
        <TweakRadio
          label="Thema"
          value={t.theme}
          options={["dark", "light", "studio"]}
          onChange={(v) => setTweak('theme', v)}
        />

        <TweakSection label="Tekst" />
        <TweakText
          label="Kop"
          value={t.headline}
          onChange={(v) => setTweak('headline', v)}
        />
        <TweakToggle
          label="Onderschriften"
          value={t.showCaptions}
          onChange={(v) => setTweak('showCaptions', v)}
        />
        <TweakToggle
          label="Notities onderaan"
          value={t.showNotes}
          onChange={(v) => setTweak('showNotes', v)}
        />
      </TweaksPanel>
    </>
  );
}

// TweakColor accepts named tokens as well — map them to hex for the swatch
// (TweakColor uses the option strings directly as background-color, and CSS
// understands "black"/"silver"/"orange"; "titanium" we fake with a hex.)
// We don't need to remap — CSS supports those names except titanium; override:
const __origLog = console.warn;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
